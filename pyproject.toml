[project]
name = "codecraftai-webworks"
version = "1.5.2"
description = "Code Craft AI - WebWorks"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = []
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.32.5,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    # The OAuth client, OIDC id_token validation, and the signed
    # pre-auth state cookie are implemented in-house — see
    # ``ccai.webworks.authentication.oauth``,
    # ``ccai.webworks.security.jsonwebtoken``, and
    # ``ccai.webworks.security.signedserializer``. They previously
    # relied on ``authlib`` / ``joserfc`` / ``itsdangerous`` (behind an
    # ``oauth`` extra); those framework libraries have been dropped.
    # ``cryptography`` is the one primitive that remains: RSA / ECDSA
    # signature verification cannot be hand-rolled safely in pure
    # Python, so the JOSE module delegates the asymmetric verify step to
    # PyCA ``cryptography`` (the same foundational library already used
    # by ``ccai.webworks.configuration.sources``). The base64url,
    # compact-serialization, claims-registry, and HMAC paths are pure
    # standard library.
    "cryptography>=42.0.0,<51.0.0",
    "codecraftai-foundations>=1.0.0,<2.0.0",
    "codecraftai-this-app>=1.0.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "codecraftai-configuration>=1.0.0,<2.0.0",
    "codecraftai-credentials>=1.0.0,<2.0.0",
    "codecraftai-dataprofiles>=1.0.0,<2.0.0",

    ]

[project.optional-dependencies]
# Template engines are pluggable and imported lazily by
# ccai.webworks.templating; install the one you render with.
jinja2 = ["jinja2>=3.1.0,<4.0.0"]
mako = ["mako>=1.3.0,<2.0.0"]
templating = ["jinja2>=3.1.0,<4.0.0", "mako>=1.3.0,<2.0.0"]

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-webworks"
Issues = "https://github.com/code-craft-ai-company/codecraftai-webworks/issues"

[dependency-groups]
# Both engines are installed for development so the adapter tests run.
dev = [
    "jinja2>=3.1.0,<4.0.0",
    "mako>=1.3.0,<2.0.0",
]
dbio = []

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]
# The README only marks the shared 'ccai' namespace directory in the source tree. It stays out of the
# wheel because several codecraftai packages install into that directory and a file there collides.
exclude = ["source/packages/ccai/README.md"]
include = [
    # Vendored Swagger UI / OpenAPI assets served by SwaggerUIBlueprint.
    { path = "source/packages/ccai/webworks/openapi/static/**/*", format = ["sdist", "wheel"] },
    # The stylesheet of the book pages served by BooksBlueprint.
    { path = "source/packages/ccai/webworks/books/static/**/*", format = ["sdist", "wheel"] },
    # mj-* web component library shipped with the package: design tokens
    # and base stylesheet (static/styles/), the JavaScript foundation,
    # all component modules, the comprehensive chart library, the
    # registration barrel (static/javascript/), and the demo gallery
    # (static/gallery.html). Served to consumer sites via the static
    # handler.
    { path = "source/packages/ccai/webworks/static/**/*", format = ["sdist", "wheel"] },
]

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
