[project]
name = "codecraftai-webworks"
version = "1.6.0"
description = "Code Craft AI - WebWorks"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [
    { name = "Code Craft AI LLC" },
]
keywords = [
    "python",
    "web",
    "framework",
    "asgi",
    "wsgi",
    "rest",
    "openapi",
    "web-components",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    # The version the merge gate requires to pass.
    "Programming Language :: Python :: 3.12",
    # The merge gate runs the suite on Linux, macOS and Windows.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.32.5,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    # The OAuth client, OIDC id_token validation, and the signed
    # pre-auth state cookie are implemented in-house — see
    # ``ccai.webworks.authentication.oauth``,
    # ``ccai.webworks.security.jsonwebtoken``, and
    # ``ccai.webworks.security.signedserializer``. They previously
    # relied on ``authlib`` / ``joserfc`` / ``itsdangerous`` (behind an
    # ``oauth`` extra); those framework libraries have been dropped.
    # ``cryptography`` is the one primitive that remains: RSA / ECDSA
    # signature verification cannot be hand-rolled safely in pure
    # Python, so the JOSE module delegates the asymmetric verify step to
    # PyCA ``cryptography`` (the same foundational library already used
    # by ``ccai.webworks.configuration.sources``). The base64url,
    # compact-serialization, claims-registry, and HMAC paths are pure
    # standard library.
    "cryptography>=42.0.0,<51.0.0",
    # The shipped package imports two sibling packages: ``ccai.errors``
    # (codecraftai-foundations) and ``ccai.thisapp`` (codecraftai-this-app).
    # The test runner, codecraftai-testbase, is imported only by the test
    # trees under source/testroots and source/testsites, so it is the
    # ``test`` extra below rather than a requirement of every install.
    "codecraftai-foundations>=1.0.0,<2.0.0",
    "codecraftai-this-app>=1.0.0,<2.0.0",
]

[project.scripts]
# The developer command line: serve, prodserve, new, routes, shell, generate, db.
# Also runnable as ``python -m ccai.webworks.devexp.cli``.
webworks = "ccai.webworks.devexp.cli.webworkscli:main"

[project.optional-dependencies]
# Template engines are pluggable and imported lazily by
# ccai.webworks.templating; install the one you render with.
jinja2 = ["jinja2>=3.1.0,<4.0.0"]
mako = ["mako>=1.3.0,<2.0.0"]
templating = ["jinja2>=3.1.0,<4.0.0", "mako>=1.3.0,<2.0.0"]
# Pydantic models as REST request/response schemas and in the OpenAPI
# schema converter (ccai.webworks.endpoints.rest, ccai.webworks.openapi).
# The code uses the Pydantic 2 API (model_validate, model_dump).
pydantic = ["pydantic>=2.5.0,<3.0.0"]
# The gevent worker of the production server (ccai.webworks.prodserver).
gevent = ["gevent>=24.2.1,<26.0.0"]
# TOML configuration files (ccai.webworks.configuration.sources): tomli
# reads them on Python 3.10, where the standard library has no tomllib,
# and tomli-w writes them on every version.
toml = [
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0,<2.0.0",
]
# IPython as the interactive shell of ``webworks shell``.
shell = ["ipython>=8.18.0,<10.0.0"]
# Running the test suites: the testbase runner for both suites, and
# Playwright for the browser suite of the testcomponents site
# (source/testsites/testcomponents/tests). After installing, download the
# browser with ``python -m playwright install chromium``.
test = [
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "playwright>=1.50.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-webworks"
Issues = "https://github.com/code-craft-ai-company/codecraftai-webworks/issues"

[dependency-groups]
# Both engines are installed for development so the adapter tests run, and
# so are the test runner and Playwright, so both suites can be run from a
# plain ``poetry install``.
dev = [
    "jinja2>=3.1.0,<4.0.0",
    "mako>=1.3.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "playwright>=1.50.0,<2.0.0",
]
dbio = []

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]
# The README only marks the shared 'ccai' namespace directory in the source tree. It stays out of the
# wheel because several codecraftai packages install into that directory and a file there collides.
exclude = ["source/packages/ccai/README.md"]
include = [
    # Vendored Swagger UI / OpenAPI assets served by SwaggerUIBlueprint.
    { path = "source/packages/ccai/webworks/openapi/static/**/*", format = ["sdist", "wheel"] },
    # The stylesheet of the book pages served by BooksBlueprint.
    { path = "source/packages/ccai/webworks/books/static/**/*", format = ["sdist", "wheel"] },
    # mj-* web component library shipped with the package: design tokens
    # and base stylesheet (static/styles/), the JavaScript foundation,
    # all component modules, the comprehensive chart library, the
    # registration barrel (static/javascript/), and the demo gallery
    # (static/gallery.html). Served to consumer sites via the static
    # handler.
    { path = "source/packages/ccai/webworks/static/**/*", format = ["sdist", "wheel"] },
]

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
# This file uses PEP 621 [project] metadata and [dependency-groups], which
# poetry-core understands from 2.0. The upper bound keeps a future major
# release from changing how a source install is built.
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
