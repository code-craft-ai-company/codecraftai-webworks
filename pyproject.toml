[tool.poetry]
name = "codecraftai-webworks"
description = "Code Craft AI - WebWorks"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]
include = [
    # Vendored Swagger UI / OpenAPI assets served by SwaggerUIBlueprint.
    { path = "source/packages/ccai/webworks/openapi/static/**/*", format = ["sdist", "wheel"] },
    # mj-* web component library shipped with the package: design tokens
    # and base stylesheet (static/styles/), the JavaScript foundation,
    # all component modules, the comprehensive chart library, the
    # registration barrel (static/javascript/), and the demo gallery
    # (static/gallery.html). Served to consumer sites via the static
    # handler.
    { path = "source/packages/ccai/webworks/static/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.5"
# The OAuth client, OIDC id_token validation, and the signed
# pre-auth state cookie are implemented in-house — see
# ``ccai.webworks.authentication.oauth``,
# ``ccai.webworks.security.jsonwebtoken``, and
# ``ccai.webworks.security.signedserializer``. They previously
# relied on ``authlib`` / ``joserfc`` / ``itsdangerous`` (behind an
# ``oauth`` extra); those framework libraries have been dropped.
#
# ``cryptography`` is the one primitive that remains: RSA / ECDSA
# signature verification cannot be hand-rolled safely in pure
# Python, so the JOSE module delegates the asymmetric verify step to
# PyCA ``cryptography`` (the same foundational library already used
# by ``ccai.webworks.configuration.sources``). The base64url,
# compact-serialization, claims-registry, and HMAC paths are pure
# standard library.
cryptography = ">=42.0.0,<46.0.0"
codecraftai-this-app = { git = "https://github.com/automationmojo/codecraftai-this-app.git", branch = "main" }
codecraftai-testbase = { git = "https://github.com/automationmojo/codecraftai-testbase.git", branch = "main" }
codecraftai-configuration = { git = "https://github.com/automationmojo/codecraftai-configuration.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-dataprofiles = { git = "https://github.com/automationmojo/codecraftai-dataprofiles.git", branch = "main" }

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
