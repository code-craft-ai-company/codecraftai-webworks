[pytest]
# Pytest configuration for the testcomponents Playwright suite.
#
# Run from this directory:
#     pytest
#
# Requires: pytest, pytest-playwright, and the Playwright browsers
# (installed with `playwright install chromium`).

addopts = -ra --tb=short
testpaths = .
python_files = test_*.py
markers =
    functional: deeper per-component interaction tests.
