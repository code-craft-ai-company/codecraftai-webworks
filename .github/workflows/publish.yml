# Package publish pipeline.
#
# Runs when the version in pyproject.toml changes on main, and on demand
# via workflow_dispatch. A release is uploaded only after the Merge Gate
# has passed for the same commit: job ``gate`` calls merge_gate.yml and
# job ``publish`` needs it. A published version cannot be replaced, so a
# version bump on a failing commit must never reach the package index.
#
# Job ``publish`` builds the wheel + sdist with poetry, checks them with
# ``twine check --strict`` (the README must render the way PyPI renders
# it), inspects the wheel for the static assets and the console script,
# and uploads them to:
#
# 1. The Code Craft AI package repository at
#    https://artifacts.code-craft.ai/repository/legacy (job ``publish``).
# 2. PyPI (job ``pypi``), when the organization variable
#    ``PUBLISH_TO_PYPI`` is ``true``.
#
# The artifacts host is the artifacts service's own canonical name. The
# apex (https://code-craft.ai/repository/legacy) still works and is a
# permanent compatibility surface -- the website's nginx proxies it
# here -- but publishing straight at the canonical host removes a
# hop and a dependency on the website being up to push a package.
#
# Artifacts auth: the endpoint accepts ``Basic <ignored>:<publish-token>``
# — the username is ignored server-side; the password must be an
# ACTIVE publish token minted in the site's internal dashboard
# (Publishing → publish tokens). The token is stored as the
# organization-level secret ``CCAI_ORG_ARTIFACT_PUBLISHING`` with
# selected-repository access; this repository must be on that
# secret's access list or the guard step below fails the run with
# instructions.
#
# PyPI auth: when the secret ``PYPI_API_TOKEN`` is visible to this
# repository, the upload uses it. An account-scoped token creates a new
# PyPI project on its first upload, with nothing to configure per
# project. When the secret is not set, the upload uses PyPI trusted
# publishing: the PyPI project (or a pending publisher for it) must
# trust this repository, workflow ``publish.yml`` and environment
# ``pypi``.
#
# PyPI accepts a version only once. To put a version that is already on
# the artifacts repository onto PyPI, run this workflow by hand with
# ``force`` and ``skip_artifacts`` both set.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version did not change"
        type: boolean
        default: false
      skip_artifacts:
        description: "Skip the upload to artifacts.code-craft.ai (publish to PyPI only)"
        type: boolean
        default: false

jobs:
  version:
    # Decides whether there is anything to publish, so the gate and the
    # build only run for a version change (or a forced run).
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 is needed to tell whether the version actually changed.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine whether the version changed
        id: version
        run: |
          read_version () {
            python3 - "$1" <<'PY'
          import sys, tomllib
          try:
              data = tomllib.loads(sys.argv[1])
          except Exception:
              print("")
              sys.exit(0)
          project = data.get("project", {})
          print(project.get("version") or data.get("tool", {}).get("poetry", {}).get("version", ""))
          PY
          }

          current=$(read_version "$(cat pyproject.toml)")
          if [ -z "$current" ]; then
            echo "::error::pyproject.toml declares no [project] version."
            exit 1
          fi

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            previous=$(read_version "$(git show HEAD~1:pyproject.toml 2>/dev/null || true)")
          else
            previous=""
          fi

          echo "current=${current}" >> "$GITHUB_OUTPUT"

          if [ "${current}" = "${previous}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version is unchanged at ${current}; nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version ${previous:-<none>} -> ${current}; publishing."
          fi

  gate:
    # The full Merge Gate (single-host suite on every OS, wheel build and
    # smoke test, browser suite) for the commit that is about to be
    # published.
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/merge_gate.yml
    secrets: inherit

  publish:
    # Skipped unless the version changed AND the gate passed.
    needs: [version, gate]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ needs.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify publishing secret is visible to this repo
        if: inputs.skip_artifacts != true
        env:
          PUBLISH_TOKEN: ${{ secrets.CCAI_ORG_ARTIFACT_PUBLISHING }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::CCAI_ORG_ARTIFACT_PUBLISHING resolved empty in this repository. It is an ORGANIZATION secret with selected-repository access — add THIS repo to its access list: org Settings -> Secrets and variables -> Actions -> CCAI_ORG_ARTIFACT_PUBLISHING -> Repository access." >&2
            exit 1
          fi
          echo "publishing secret is visible"

      - name: Install build tools
        run: |
          pipx install poetry
          pipx install twine

      - name: Pin internal dependencies for the published artifact
        run: |
          # Source keeps 'branch = "main"' so day-to-day development tracks
          # the tip of each sibling. A published wheel cannot: a git URL
          # pointing at a private repository is not installable by a
          # subscriber. Rewrite those to a compatible-release range here, in
          # the build tree only -- the change is never committed.
          python3 - <<'PY'
          import re

          PIN = ">=1.0,<2.0"

          with open("pyproject.toml", encoding="utf-8") as handle:
              content = handle.read()

          pattern = re.compile(
              r'^(?P<name>codecraftai-[a-z0-9-]+)\s*=\s*\{[^}]*git\s*=\s*"[^"]+"[^}]*\}',
              re.M,
          )

          rewritten = []

          def replace(match):
              name = match.group("name")
              rewritten.append(name)
              return '{} = "{}"'.format(name, PIN)

          content = pattern.sub(replace, content)

          with open("pyproject.toml", "w", encoding="utf-8") as handle:
              handle.write(content)

          if len(rewritten) > 0:
              print("Pinned {} internal dependencies to '{}':".format(len(rewritten), PIN))
              for name in rewritten:
                  print("    {}".format(name))
          else:
              print("No internal git dependencies to pin.")
          PY

      - name: Build wheel + sdist
        run: |
          poetry build
          ls -l dist/

      - name: Check the distributions
        run: twine check --strict dist/*

      - name: Inspect the wheel
        # The gate inspected and smoke-tested a wheel built from this commit;
        # this checks the artifact that is actually uploaded.
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit("Expected exactly one wheel in dist/, found: {}".format(wheels))

          archive = zipfile.ZipFile(wheels[0])
          names = archive.namelist()

          problems = []

          for prefix in (
              "ccai/webworks/static/javascript/",
              "ccai/webworks/static/styles/",
              "ccai/webworks/openapi/static/",
              "ccai/webworks/books/static/",
          ):
              count = len([name for name in names if name.startswith(prefix)])
              print("{:45s} {} files".format(prefix, count))
              if count == 0:
                  problems.append("no files under {}".format(prefix))

          entry_points = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
          if len(entry_points) != 1:
              problems.append("the wheel declares no entry points")
          elif "webworks=ccai.webworks.devexp.cli.webworkscli:main" not in archive.read(entry_points[0]).decode("utf-8").replace(" ", ""):
              problems.append("the 'webworks' console script is not declared")

          metadata = [name for name in names if name.endswith(".dist-info/METADATA")]
          if len(metadata) == 1 and "git+" in archive.read(metadata[0]).decode("utf-8"):
              problems.append("the wheel metadata still points at a git repository")

          if len(problems) > 0:
              for problem in problems:
                  print("::error::{}".format(problem))
              sys.exit(1)

          print("Wheel contents look complete: {} files.".format(len(names)))
          PY

      - name: Keep the distributions for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Publish to artifacts.code-craft.ai
        if: inputs.skip_artifacts != true
        env:
          TWINE_USERNAME: publisher
          TWINE_PASSWORD: ${{ secrets.CCAI_ORG_ARTIFACT_PUBLISHING }}
          TWINE_REPOSITORY_URL: https://artifacts.code-craft.ai/repository/legacy
        run: |
          twine upload --non-interactive --disable-progress-bar dist/*
          echo "Published ${{ github.repository }} ${{ needs.version.outputs.current }}"

  pypi:
    needs: publish
    if: needs.publish.outputs.changed == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codecraftai-webworks/
    permissions:
      # Trusted publishing exchanges this job's OIDC token for a PyPI upload token.
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is not set, which makes the action use trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
